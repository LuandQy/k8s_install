- name: Rise | Copy architecture-matched nerdctl
  when: .rise.install_nerdctl | default true
  copy:
    src: "{{ .rise.tools_dir }}/{{ .binary_type }}/nerdctl"
    dest: /usr/local/bin/nerdctl
    mode: 0755
- name: Rise | Ensure /etc/nerdctl/nerdctl.toml exists
  when: .rise.install_nerdctl | default true
  command: |
    if [ ! -f /etc/nerdctl/nerdctl.toml ]; then
      mkdir -p /etc/nerdctl
      chmod 0755 /etc/nerdctl
      cat <<'EOF' > /etc/nerdctl/nerdctl.toml
    namespace      = "k8s.io"
    cgroup_manager = "cgroupfs"
    hosts_dir      = ["/etc/containerd/certs.d", "/etc/docker/certs.d"]
    EOF
      chmod 0644 /etc/nerdctl/nerdctl.toml
    fi
- name: Rise | Verify CRI Harbor image pull
  command: |
    crictl --runtime-endpoint unix:///run/containerd/containerd.sock pull {{ .image_registry.auth.registry }}/kubernetes/pause:{{ .kubernetes.sandbox_image.tag }}
- name: Rise | Verify nerdctl Harbor image pull
  when: .rise.install_nerdctl | default true
  command: |
    nerdctl --namespace k8s.io --hosts-dir /etc/containerd/certs.d pull {{ .image_registry.auth.registry }}/kubernetes/pause:{{ .kubernetes.sandbox_image.tag }}
