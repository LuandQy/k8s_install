---
# Scoped KubeKey reset: no CRI, registry, storage-disk or filesystem removal role.
- hosts: [k8s_cluster, etcd]
  gather_facts: true
  roles: [native/root]
- hosts: [k8s_cluster, etcd]
  gather_facts: true
  roles: [defaults]
- hosts: [k8s_cluster]
  roles: [uninstall/kubernetes]
- hosts: [etcd]
  roles:
    - role: etcd/scaling_down
      when: .etcd.deployment_type | eq "external"
